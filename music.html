<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Müzik - Jinda'nın Günü</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <div class="aurora aurora-one"></div>
      <div class="aurora aurora-two"></div>
      <div class="glow glow-one"></div>
      <div class="glow glow-two"></div>
      <div class="sky-overlay"></div>
    </div>

    <main class="page-shell">
      <section class="content-screen is-visible">
        <div class="app-shell">
          <header class="top-bar">
            <div class="brand">
              <span class="brand-mark">✦</span>
              <div>
                <p class="brand-title">Müzik</p>
                <p class="brand-subtitle">Rastgele akışlar</p>
              </div>
            </div>
            <nav class="main-nav" aria-label="Ana menü">
              <a class="nav-link" href="index.html">Ana Sayfa</a>
              <a class="nav-link" href="album.html">Albüm</a>
              <a class="nav-link" href="poem.html">Şiir</a>
              <a class="nav-link" href="confession.html">İtiraf</a>
              <a class="nav-link" href="surprise.html">Sürpriz</a>
              <a class="nav-link active" href="music.html">Müzik</a>
              <a class="nav-link" href="theme.html">Tema</a>
            </nav>
          </header>

          <section class="panel active">
            <div class="hero-card">
              <p class="eyebrow">Müzik</p>
              <h2>Bu bölümde farklı müzik akışlarını seçebilirsin.</h2>
              <p id="playbackStatus" class="status-text">Hazır</p>
            </div>

            <div class="music-shell">
              <div class="music-card">
                <div class="album-art"></div>
                <div>
                  <h3 id="songTitle">Yıldızlı Gece</h3>
                  <p id="songDescription">Hafif ve sakin bir başlangıç</p>
                  <span id="songMeta" class="song-meta">Rastgele • Yıldızlı Gece</span>
                </div>
              </div>

              <div class="music-card">
                <ul class="playlist-list">
                  <li><button class="playlist-option" data-track="0" type="button">Yıldızlı Gece</button></li>
                  <li><button class="playlist-option" data-track="1" type="button">Dumanlı Rüya</button></li>
                  <li><button class="playlist-option" data-track="2" type="button">Küçük Şafak</button></li>
                  <li><button class="playlist-option" data-track="3" type="button">Gece Yolculuğu</button></li>
                </ul>
              </div>

              <div class="control-row">
                <button class="control-btn" data-action="prev" type="button">◀</button>
                <button class="control-btn control-btn-play" type="button">▶</button>
                <button class="control-btn" data-action="next" type="button">▶▶</button>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
