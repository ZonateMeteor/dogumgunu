<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Doğum Günü - Taslak</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <header class="topbar">
    <button id="hamburger" aria-label="Menüyü aç" class="icon-btn">☰</button>
    <h1 id="site-title">Doğum Günü</h1>
    <button id="favorites-btn" aria-label="Favoriler" class="icon-btn">♡</button>
  </header>

  <main id="app">
    <section id="welcome" class="center-screen">
      <h2>Merhaba...</h2>
      <button id="open-message" class="primary">Tıkla</button>
      <p class="hint">Daha fazlası için sol üstteki üç çizgiye basabilirsiniz.</p>
    </section>
  </main>

  <nav id="side-menu" class="side-menu hidden" aria-hidden="true">
    <ul>
      <li><a href="/siirler" data-link>Şiirler</a></li>
      <li><a href="/itiraflar" data-link>İtiraflar</a></li>
      <li><a href="/anilar" data-link>Anılar</a></li>
      <li><a href="/muzikler" data-link>Müzikler</a></li>
      <li><a href="/oyunlar" data-link>Oyunlar</a></li>
      <li><a href="/etimoloji" data-link>Etimoloji</a></li>
      <li><a href="/geribildirim" data-link>Geri Bildirim</a></li>
      <li><a href="/temalar" data-link>Temalar</a></li>
      <li><button id="close-menu" class="link-like">Kapat</button></li>
    </ul>
  </nav>

  <div id="favorites-popup" class="popup hidden" aria-hidden="true">
    <h3>Favoriler</h3>
    <ul id="favorites-list"></ul>
    <button id="close-favs">Kapat</button>
  </div>

  <div id="overlay" class="overlay hidden" data-role="overlay"></div>

  <script src="/js/storage.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
